ref: zabbix.script_execute
label: "Execute Remote Script"
description: "Execute one preconfigured Zabbix script on one host after exact confirmation"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: zabbix_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: zabbix.credentials, required: true}
  script_id: {type: string, required: true, pattern: "^[1-9][0-9]*$"}
  host_id: {type: string, required: true, pattern: "^[1-9][0-9]*$"}
  confirmation: {type: string, required: true, description: "Exactly EXECUTE SCRIPT <script_id> ON HOST <host_id>"}
  timeout_seconds: {type: integer, default: 30, minimum: 1, maximum: 120}
output: {operation: {type: string}, request_id: {type: string}, data: {type: any}, meta: {type: object}}
tags: [zabbix, script, remote-execution, write]
