ref: zabbix.template_unlink
label: "Unlink Templates"
description: "Unlink explicit templates from one host without clearing inherited entities"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: zabbix_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: zabbix.credentials, required: true}
  host_id: {type: string, required: true, pattern: "^[1-9][0-9]*$"}
  template_ids: {type: array, required: true, minItems: 1, maxItems: 100, items: {type: string}}
  confirmation: {type: string, required: true, description: "Exactly UNLINK TEMPLATES <comma_ids> FROM HOST <host_id>"}
  timeout_seconds: {type: integer, default: 30, minimum: 1, maximum: 120}
output: {operation: {type: string}, request_id: {type: string}, data: {type: any}, meta: {type: object}}
tags: [zabbix, template, host, write]
