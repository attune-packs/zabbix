ref: zabbix.host_create
label: "Create Host"
description: "Create one host in explicit groups; templates must be linked separately"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: zabbix_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: zabbix.credentials, required: true}
  host: {type: string, required: true, maxLength: 128}
  visible_name: {type: string, maxLength: 128}
  description: {type: string, maxLength: 2048}
  group_ids: {type: array, required: true, minItems: 1, maxItems: 1000, items: {type: string}}
  interfaces: {type: array, minItems: 1, maxItems: 16, items: {type: object}}
  timeout_seconds: {type: integer, default: 30, minimum: 1, maximum: 120}
output: {operation: {type: string}, request_id: {type: string}, data: {type: any}, meta: {type: object}}
tags: [zabbix, host, write]
